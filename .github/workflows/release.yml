name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Package Windows release (§26 step 25)
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-windows
          path: target/release/dist/*.zip
      # Publishing the artifact to GitHub Releases / registries is intentionally
      # not wired up (deliberately out of scope for now).