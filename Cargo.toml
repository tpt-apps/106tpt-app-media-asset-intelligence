[workspace]
members = [
  "crates/tpt-app-media-asset-intelligence-core",
  "crates/tpt-app-media-asset-intelligence-model",
  "crates/tpt-app-media-asset-intelligence-ingest",
  "crates/tpt-app-media-asset-intelligence-dedupe",
  "crates/tpt-app-media-asset-intelligence-scenes",
  "crates/tpt-app-media-asset-intelligence-tagging",
  "crates/tpt-app-media-asset-intelligence-search",
  "crates/tpt-app-media-asset-intelligence-health",
  "crates/tpt-app-media-asset-intelligence-persistence",
  "crates/tpt-app-media-asset-intelligence-queue",
  "crates/tpt-app-media-asset-intelligence-cli",
  "crates/tpt-app-media-asset-intelligence-service",
  "crates/tpt-app-media-asset-intelligence-tauri",
  "crates/tpt-app-media-asset-intelligence-test",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-apps/106tpt-app-media-asset-intelligence"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
proptest = "1"
# TPT AV foundation crates, pinned by rev (ecosystem convention per
# tpt-av-asset/Cargo.toml and tpt-visual/Cargo.toml).
tpt-av-asset-utils = { git = "https://github.com/tpt-solutions/tpt-av-asset", rev = "bb257b3afb3b911ab5f584c212c7603c3df1551d" }
tpt-av-asset-db = { git = "https://github.com/tpt-solutions/tpt-av-asset", rev = "bb257b3afb3b911ab5f584c212c7603c3df1551d" }
tpt-av-asset-cache = { git = "https://github.com/tpt-solutions/tpt-av-asset", rev = "bb257b3afb3b911ab5f584c212c7603c3df1551d" }
tpt-av-asset-proxy = { git = "https://github.com/tpt-solutions/tpt-av-asset", rev = "bb257b3afb3b911ab5f584c212c7603c3df1551d" }
tpt-av-asset-watcher = { git = "https://github.com/tpt-solutions/tpt-av-asset", rev = "bb257b3afb3b911ab5f584c212c7603c3df1551d" }
tpt-av-asset-pipeline = { git = "https://github.com/tpt-solutions/tpt-av-asset", rev = "bb257b3afb3b911ab5f584c212c7603c3df1551d" }
tpt-kinetix-core = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "b904ff31fd90fb8ffdc6bd2a00594767e1eb3e91" }
tpt-kinetix-demux = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "b904ff31fd90fb8ffdc6bd2a00594767e1eb3e91" }
tpt-kinetix-av1 = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "b904ff31fd90fb8ffdc6bd2a00594767e1eb3e91" }
tpt-kinetix-vp9 = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "b904ff31fd90fb8ffdc6bd2a00594767e1eb3e91" }
tpt-av-cadence-core = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "95ff6bf9349641d4cecfc15a3bd191fa228b5617" }
tpt-av-cadence-wav = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "95ff6bf9349641d4cecfc15a3bd191fa228b5617" }
tpt-av-cadence-flac = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "95ff6bf9349641d4cecfc15a3bd191fa228b5617" }
tpt-av-cadence-ogg = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "95ff6bf9349641d4cecfc15a3bd191fa228b5617" }
tpt-av-cadence-opus = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "95ff6bf9349641d4cecfc15a3bd191fa228b5617" }
tpt-av-cadence-vorbis = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "95ff6bf9349641d4cecfc15a3bd191fa228b5617" }
tpt-av-visual-utils = { git = "https://github.com/tpt-solutions/tpt-visual", rev = "7f79eb975354dd9825eb26b912c457d3539e6fce" }
