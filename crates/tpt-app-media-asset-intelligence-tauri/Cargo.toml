[package]
name = "tpt-app-media-asset-intelligence-tauri"
description = "Desktop shell for TPT Media Asset Intelligence: archive browser, search, asset inspector, duplicate/tagging review, health dashboard and indexing queue (spec §13)."
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-apps/106tpt-app-media-asset-intelligence"
homepage = "https://opensource.tptsolutions.co.nz/"
keywords = ["media-archive", "desktop", "tauri", "local-first"]
categories = ["gui", "multimedia"]
publish = false

# This crate is excluded from the root workspace: it drags in the Tauri/WebView2
# stack, which must not be a prerequisite for working on the engine. Build it with
# `cargo build --manifest-path crates/tpt-app-media-asset-intelligence-tauri/Cargo.toml`.
[dependencies]
tpt-app-media-asset-intelligence-core = { path = "../tpt-app-media-asset-intelligence-core", version = "0.1.0" }
tpt-app-media-asset-intelligence-model = { path = "../tpt-app-media-asset-intelligence-model", version = "0.1.0" }
tpt-app-media-asset-intelligence-search = { path = "../tpt-app-media-asset-intelligence-search", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `tauri`'s custom-protocol feature is required in release builds by the bundler.
default = []
custom-protocol = ["tauri/custom-protocol"]
