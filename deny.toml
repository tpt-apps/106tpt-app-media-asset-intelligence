# cargo-deny configuration for tpt-app-media-asset-intelligence.
#
# Policy (spec §17): the index must work fully offline and this workspace must not
# introduce copyleft or C-native media dependencies that the TPT AV foundation
# explicitly avoids. The allow list IS the policy — anything not listed here
# (GPL, LGPL, AGPL, MPL, ...) is denied, as are the specific banned crates.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    # unicode-ident (a transitive dependency of unicode tooling) ships the
    # Unicode data files under this license. Data license, not copyleft.
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # C-based / copyleft media stacks are explicitly banned: the deterministic
    # decode stack comes from the pure-Rust TPT foundation (spec §5, §17).
    { name = "sqlite3-sys" },
    { name = "libsqlite3-sys" },
    { name = "ffmpeg-sys" },
    { name = "ffmpeg-sys-next" },
    { name = "ffmpeg-next" },
]

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
